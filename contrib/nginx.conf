# nginx site for sbm-sync. TLS: certbot --nginx -d sbm.example.org
server {
    listen 80;
    listen [::]:80;
    server_name sbm.example.org;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8750;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
